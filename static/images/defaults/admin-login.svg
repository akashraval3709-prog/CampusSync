<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.15" />
    </linearGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Decorative Shapes -->
  <circle cx="400" cy="300" r="260" fill="url(#bgGrad)" />
  <circle cx="650" cy="120" r="80" fill="#06B6D4" opacity="0.1" />
  <circle cx="150" cy="480" r="110" fill="#2563EB" opacity="0.08" />
  
  <!-- Central Dashboard / Laptop Frame -->
  <g filter="url(#softShadow)">
    <!-- Laptop Base Base-stand -->
    <rect x="220" y="440" width="360" height="16" rx="8" fill="#94A3B8" />
    <path d="M 360 440 L 440 440 L 430 448 L 370 448 Z" fill="#64748B" />

    <!-- Laptop Monitor Screen Outer -->
    <rect x="180" y="160" width="440" height="280" rx="16" fill="url(#screenGrad)" />
    <!-- Screen Inner Display -->
    <rect x="192" y="172" width="416" height="256" rx="8" fill="#F8FAFC" />
    
    <!-- Top Bar of Dashboard UI inside Monitor -->
    <rect x="192" y="172" width="416" height="36" fill="#0F172A" />
    <circle cx="212" cy="190" r="5" fill="#EF4444" />
    <circle cx="228" cy="190" r="5" fill="#F59E0B" />
    <circle cx="244" cy="190" r="5" fill="#10B981" />
    <rect x="270" y="184" width="120" height="12" rx="6" fill="#334155" />
    <!-- User avatar small -->
    <circle cx="584" cy="190" r="10" fill="#2563EB" />

    <!-- Sidebar UI in Monitor -->
    <rect x="192" y="208" width="80" height="220" fill="#1E293B" />
    <rect x="204" y="224" width="56" height="8" rx="4" fill="#334155" />
    <rect x="204" y="244" width="56" height="8" rx="4" fill="#2563EB" />
    <rect x="204" y="264" width="56" height="8" rx="4" fill="#334155" />
    <rect x="204" y="284" width="56" height="8" rx="4" fill="#334155" />

    <!-- Dashboard Content Widgets inside screen -->
    <!-- Widget 1: Attendance Graph -->
    <rect x="284" y="220" width="190" height="100" rx="8" fill="#FFFFFF" filter="url(#softShadow)" />
    <text x="296" y="238" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0F172A">Daily Attendance</text>
    <!-- Bar Chart Graphic -->
    <rect x="300" y="280" width="14" height="30" rx="3" fill="#2563EB" />
    <rect x="322" y="260" width="14" height="50" rx="3" fill="#06B6D4" />
    <rect x="344" y="250" width="14" height="60" rx="3" fill="#2563EB" />
    <rect x="366" y="270" width="14" height="40" rx="3" fill="#10B981" />
    <rect x="388" y="240" width="14" height="70" rx="3" fill="#2563EB" />
    <rect x="410" y="255" width="14" height="55" rx="3" fill="#06B6D4" />
    <rect x="432" y="265" width="14" height="45" rx="3" fill="#2563EB" />

    <!-- Widget 2: Student Stats -->
    <rect x="484" y="220" width="112" height="100" rx="8" fill="#FFFFFF" filter="url(#softShadow)" />
    <circle cx="540" cy="260" r="24" fill="#2563EB" opacity="0.1" />
    <path d="M 532 268 C 532 258 548 258 548 268 M 540 254 A 5 5 0 1 0 540 244 A 5 5 0 1 0 540 254" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="540" y="300" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">2,450 Active</text>

    <!-- Widget 3: Live QR Scanner Feed Card -->
    <rect x="284" y="330" width="312" height="86" rx="8" fill="#FFFFFF" filter="url(#softShadow)" />
    <rect x="296" y="342" width="60" height="60" rx="6" fill="#0F172A" />
    <!-- QR Code graphic placeholder -->
    <rect x="304" y="350" width="16" height="16" fill="#FFFFFF" />
    <rect x="308" y="354" width="8" height="8" fill="#0F172A" />
    <rect x="332" y="350" width="16" height="16" fill="#FFFFFF" />
    <rect x="336" y="354" width="8" height="8" fill="#0F172A" />
    <rect x="304" y="378" width="16" height="16" fill="#FFFFFF" />
    <rect x="308" y="382" width="8" height="8" fill="#0F172A" />
    <rect x="326" y="372" width="12" height="12" fill="#06B6D4" />
    <rect x="340" y="380" width="10" height="14" fill="#10B981" />

    <text x="368" y="360" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0F172A">Smart QR Scanner</text>
    <text x="368" y="376" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Instant Attendance Sync</text>
    <rect x="368" y="386" width="90" height="14" rx="7" fill="#10B981" opacity="0.15" />
    <text x="413" y="396" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#10B981" text-anchor="middle">System Active</text>
  </g>

  <!-- Floating Cards & Elements around Laptop -->
  
  <!-- Left Floating Shield / Security Badge -->
  <g filter="url(#glowEffect)" transform="translate(90, 220)">
    <rect x="0" y="0" width="110" height="110" rx="18" fill="#FFFFFF" />
    <circle cx="55" cy="45" r="26" fill="url(#primaryGrad)" />
    <!-- Shield Icon -->
    <path d="M 55 30 L 68 36 V 47 C 68 56 55 62 55 62 C 55 62 42 56 42 47 V 36 L 55 30 Z" fill="#FFFFFF" />
    <text x="55" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">Admin Access</text>
  </g>

  <!-- Right Floating Certificate/Graduation Badge -->
  <g filter="url(#glowEffect)" transform="translate(590, 120)">
    <rect x="0" y="0" width="120" height="100" rx="18" fill="#FFFFFF" />
    <circle cx="60" cy="40" r="24" fill="url(#accentGrad)" />
    <!-- Mortarboard hat icon -->
    <path d="M 60 28 L 76 35 L 60 42 L 44 35 Z M 48 41.5 V 48 C 48 51 72 51 72 48 V 41.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="82" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">Campus Sync</text>
  </g>

  <!-- Bottom Floating QR Scan Success Badge -->
  <g filter="url(#softShadow)" transform="translate(520, 390)">
    <rect x="0" y="0" width="180" height="60" rx="30" fill="#0F172A" />
    <circle cx="32" cy="30" r="18" fill="#10B981" />
    <!-- Checkmark -->
    <path d="M 25 30 L 30 35 L 39 25" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">QR Verification</text>
    <text x="60" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Real-time Verified</text>
  </g>
</svg>

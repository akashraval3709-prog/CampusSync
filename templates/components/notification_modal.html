<!-- Custom Professional ERP Notification Modal Component -->
<div id="erpNotificationOverlay" class="erp-modal-overlay" style="display: none;" aria-hidden="true" role="dialog">
    <div id="erpNotificationCard" class="erp-modal-card">
        <!-- Modal Header -->
        <div class="erp-modal-header">
            <div class="erp-modal-header-left">
                <div id="erpModalIconWrapper" class="erp-modal-icon-wrapper success">
                    <i id="erpModalIcon" class="bi bi-check-circle-fill"></i>
                </div>
                <div class="erp-modal-title-group">
                    <h5 id="erpModalTitle" class="erp-modal-title">Notification</h5>
                    <span id="erpModalSubtitle" class="erp-modal-subtitle">CampusSync ERP System</span>
                </div>
            </div>
            <button type="button" id="erpModalCloseBtn" class="erp-modal-close-icon" aria-label="Close">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <hr class="erp-modal-divider">

        <!-- Modal Body -->
        <div class="erp-modal-body">
            <p id="erpModalMessage" class="erp-modal-message"></p>

            <!-- Statistics Cards Grid (Hidden by default, shown for import stats) -->
            <div id="erpModalStatsGrid" class="erp-modal-stats-grid" style="display: none;">
                <div class="erp-stat-card success">
                    <span class="erp-stat-label">Added</span>
                    <span id="erpStatAdded" class="erp-stat-value">0</span>
                </div>
                <div class="erp-stat-card warning">
                    <span class="erp-stat-label">Skipped</span>
                    <span id="erpStatSkipped" class="erp-stat-value">0</span>
                </div>
                <div class="erp-stat-card danger">
                    <span class="erp-stat-label">Errors</span>
                    <span id="erpStatErrors" class="erp-stat-value">0</span>
                </div>
            </div>

            <!-- Error Summary Counter List (Categorized counts) -->
            <div id="erpModalErrorSummary" class="erp-modal-error-summary" style="display: none;">
                <h6 class="erp-summary-heading"><i class="bi bi-list-check me-1"></i> Issue Summary:</h6>
                <div id="erpSummaryList" class="erp-summary-list"></div>
            </div>

            <!-- Collapsible Row Details Accordion -->
            <div id="erpModalDetailsContainer" class="erp-modal-details-container" style="display: none;">
                <button type="button" id="erpModalDetailsToggle" class="erp-details-toggle-btn">
                    <span><i class="bi bi-journal-text me-1"></i> View Details</span>
                    <i id="erpDetailsChevron" class="bi bi-chevron-down ms-1"></i>
                </button>
                <div id="erpModalDetailsContent" class="erp-details-content" style="display: none;">
                    <div id="erpDetailsList" class="erp-details-list"></div>
                </div>
            </div>
        </div>

        <!-- Modal Footer -->
        <div class="erp-modal-footer">
            <button type="button" id="erpModalOkBtn" class="erp-modal-ok-btn">OK</button>
        </div>
    </div>
</div>
